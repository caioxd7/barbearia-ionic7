<ion-content>
 <main class="app-shell auth-shell">
  <div class="brand">
   <div class="brand-mark"><ion-icon name="cut"></ion-icon></div>
   <span class="brand-name">Barbearia</span>
  </div>

  <h1 class="auth-title">Criar conta</h1>
  <p class="page-sub">Cadastre-se para marcar seu horário.</p>

  <form class="auth-form" #registerForm="ngForm" (ngSubmit)="register(registerForm)" novalidate>
   <label class="field"><span>Nome</span>
    <div class="field-box"><input name="name" autocomplete="name" placeholder="Seu nome" required [(ngModel)]="name"></div></label>
   <label class="field"><span>E-mail</span>
    <div class="field-box"><input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required email [(ngModel)]="email"></div></label>
   <label class="field"><span>Senha</span>
    <div class="field-box"><input type="password" name="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" required minlength="6" [(ngModel)]="password"></div></label>
   <p class="error-box" *ngIf="error" role="alert">{{error}}</p>
   <button class="btn btn-red" type="submit" [disabled]="loading">{{loading?'Criando...':'Criar conta'}}</button>
  </form>

  <p class="auth-foot">Já tem uma conta? <a routerLink="/login">Entrar</a></p>
 </main>
</ion-content>
